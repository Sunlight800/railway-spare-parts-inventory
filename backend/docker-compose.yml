version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ir_inventory_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: railway_inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ir_inventory_app
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/railway_inventory
      DEMO_MODE: "True"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
