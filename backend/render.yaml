services:
  - type: web
    name: railway-inventory-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railway-inventory-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: railway-inventory-postgres
    plan: free
    region: oregon
